project:
  name: "Phishing Email Detection"
  version: "1.0.0"

paths:
  data:
    raw: "raw_data"
    processed: "processed_data"
    features: "features_data"
  models: "models"
  logs: "logs"

data:
  filename: "CEAS_08.csv"
  test_size: 0.2
  random_state: 42

features:
  text:
    max_features: 5000
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.95
  url:
    extract_domain: true
    count_urls: true
    check_suspicious_tlds: true
  sender:
    extract_domain: true
    check_free_email_providers: true

models:
  xgboost:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
  catboost:
    iterations: 100
    depth: 6
    learning_rate: 0.1
  ensemble:
    voting: "soft"
    n_jobs: null
    weights: null
    logistic_regression:
      max_iter: 3000
      C: 1.0
      solver: "lbfgs"
      n_jobs: 1
    gradient_boosting:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 3
    random_forest:
      n_estimators: 200
      max_depth: null
      min_samples_split: 2
      n_jobs: -1

preprocessing:
  stopwords_lang: "english"
  lemmatize: true
  remove_urls: false

app:
  host: "0.0.0.0"
  port: 8000
  debug: false
